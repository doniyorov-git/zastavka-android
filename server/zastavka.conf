# Zastavka store, admin, API
# Included from silkrood.uz HTTPS and the IP default vhost (panel.conf).
# Canonical public URLs: https://silkrood.uz/zastavka/  /zastavka-admin/  /zastavka-api/

location = /zastavka {
    return 301 /zastavka/;
}
location = /zastavka-admin {
    return 301 /zastavka-admin/;
}

location ^~ /zastavka-api/ {
    proxy_pass http://127.0.0.1:3050;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
}

location ^~ /zastavka-admin/ {
    root /www/wwwroot;
    index index.html;
    try_files $uri $uri/ /zastavka-admin/index.html;
}

location ^~ /zastavka/ {
    root /www/wwwroot;
    index index.html;
    try_files $uri $uri/ /zastavka/index.html;
}
